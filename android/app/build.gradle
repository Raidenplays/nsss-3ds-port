plugins { id 'com.android.application' }

android {
    namespace 'com.raidenplays.axeolon'
    compileSdk 37
    def ndkHome = System.getenv("ANDROID_NDK_LATEST_HOME")
    if (ndkHome) {
        ndkPath ndkHome
        ndkVersion new File(ndkHome).name // the runner's newest NDK, whichever that is
    }

    defaultConfig {
        applicationId 'com.raidenplays.axeolon'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '1.2'
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static'; cppFlags '-std=gnu++17' } }
        ndk { abiFilters 'arm64-v8a', 'x86_64' } // 64-bit only (x86_64: emulators)
    }
    externalNativeBuild { cmake { path '../CMakeLists.txt'; version '3.22.1' } }
    // two editions from one codebase: the full game, and Axeolon Lite (Pocket Edition Lite's look
    // and a taste of the mod - see src/Edition.h); they install side by side
    flavorDimensions += 'edition'
    productFlavors {
        full {
            dimension 'edition'
            manifestPlaceholders = [appLabel: 'Minecraft Axeolon']
        }
        lite {
            dimension 'edition'
            applicationIdSuffix '.lite'
            versionNameSuffix ' Lite'
            manifestPlaceholders = [appLabel: 'Axeolon Lite']
            externalNativeBuild { cmake { cppFlags '-DAXEOLON_LITE=1' } }
        }
    }
    sourceSets {
        // the Pocket Edition menus, and the game's own textures, sounds and bundled world
        // the Pocket Edition menus, the game's own files (copied out to files/romfs: on first start,
        // listed in romfs_index.txt) and the bundled world
        main.assets.srcDirs = ['../pe-0.8.1', '../../romfs', layout.buildDirectory.dir('generated/romfsIndex').get().asFile.path]
        lite.assets.srcDirs = ['../pe-lite-0.2.1'] // the Lite demo's own title, buttons and pad
    }
    androidResources { noCompress 'rgba', 'ogg', 'mcr', 'dat' }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
}

// romfs_index.txt: every file under romfs/, so the game can copy them all out of the APK
def romfsIndexDir = layout.buildDirectory.dir('generated/romfsIndex')
tasks.register('romfsIndex') {
    def root = file('../../romfs')
    inputs.dir root
    outputs.dir romfsIndexDir
    doLast {
        def out = romfsIndexDir.get().file('romfs_index.txt').asFile
        out.parentFile.mkdirs()
        def names = []
        root.eachFileRecurse(groovy.io.FileType.FILES) { f -> names << root.toPath().relativize(f.toPath()).toString().replace('\\', '/') }
        names.sort()
        out.text = names.join('\n') + '\n'
    }
}
tasks.named('preBuild') { dependsOn 'romfsIndex' }
